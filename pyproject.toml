[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primerl"
version = "1.3.3"
description = "Python migration workspace for PrimeRL Edition"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Sven Reischauer" }
]
dependencies = [
  "ttkbootstrap>=1.20.4,<2",
  "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.22.2,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
